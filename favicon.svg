<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .disk { animation: spin 8s linear infinite; transform-origin: 256px 256px; }
    .inner-disk { animation: spinReverse 5s linear infinite; transform-origin: 256px 256px; }
    .glow { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.08" class="glow"/>

  <!-- Accretion disk - rotating -->
  <g class="disk">
    <ellipse cx="256" cy="256" rx="190" ry="75" fill="none" stroke-width="22" opacity="0.7">
      <animate attributeName="stroke" values="#00d4ff;#6b8afd;#e8b04a;#00d4ff" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Bright spots on disk -->
    <circle cx="100" cy="230" r="7" fill="#00d4ff" opacity="0.9"/>
    <circle cx="412" cy="275" r="5" fill="#e8b04a" opacity="0.9"/>
    <circle cx="180" cy="210" r="4" fill="#6b8afd" opacity="0.8"/>
    <circle cx="340" cy="295" r="6" fill="#00d4ff" opacity="0.7"/>
  </g>

  <!-- Inner hot disk - rotating opposite -->
  <g class="inner-disk">
    <ellipse cx="256" cy="256" rx="120" ry="45" fill="none" stroke-width="12" opacity="0.5">
      <animate attributeName="stroke" values="#e8b04a;#fff;#00d4ff;#e8b04a" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Black hole (always centered, not rotating) -->
  <circle cx="256" cy="256" r="75" fill="#0a0a0f"/>
  <circle cx="256" cy="256" r="75" fill="url(#bh)" opacity="0.3"/>

  <!-- Event horizon ring -->
  <circle cx="256" cy="256" r="78" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7" class="glow"/>
  <circle cx="256" cy="256" r="82" fill="none" stroke="#e8b04a" stroke-width="1" opacity="0.3"/>

  <!-- Tiny highlight on black hole surface -->
  <circle cx="236" cy="238" r="8" fill="#fff" opacity="0.05"/>

  <defs>
    <radialGradient id="bh" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
</svg>
