<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Outer accretion disk glow -->
  <ellipse cx="256" cy="256" rx="220" ry="90" fill="none" stroke="url(#outerGlow)" stroke-width="18" opacity="0.3"/>

  <!-- Accretion disk - back half (behind black hole) -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="url(#diskGrad)" stroke-width="24" stroke-dasharray="628 628" stroke-dashoffset="314" opacity="0.6"/>

  <!-- Black hole sphere -->
  <circle cx="256" cy="256" r="85" fill="#0a0a0f"/>
  <circle cx="256" cy="256" r="85" fill="url(#holeGrad)" opacity="0.4"/>

  <!-- Event horizon ring -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#e8b04a" stroke-width="1" opacity="0.4"/>

  <!-- Accretion disk - front half (in front of black hole) -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="url(#diskGrad)" stroke-width="28" stroke-dasharray="628 628" opacity="0.9"/>

  <!-- Hot inner disk -->
  <ellipse cx="256" cy="256" rx="130" ry="50" fill="none" stroke="url(#innerDisk)" stroke-width="16" opacity="0.7"/>

  <!-- Bright accent spots on disk -->
  <circle cx="150" cy="232" r="8" fill="#00d4ff" opacity="0.9"/>
  <circle cx="150" cy="232" r="12" fill="#00d4ff" opacity="0.3"/>
  <circle cx="362" cy="272" r="6" fill="#e8b04a" opacity="0.9"/>
  <circle cx="362" cy="272" r="10" fill="#e8b04a" opacity="0.3"/>
  <circle cx="200" cy="218" r="4" fill="#6b8afd" opacity="0.8"/>
  <circle cx="320" cy="284" r="5" fill="#00d4ff" opacity="0.7"/>

  <!-- Photon ring (thin bright ring right at event horizon) -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>

  <!-- Gravitational lensing arc - top -->
  <path d="M 170 180 Q 256 140 342 180" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.25"/>

  <!-- Gravitational lensing arc - bottom -->
  <path d="M 170 332 Q 256 372 342 332" fill="none" stroke="#e8b04a" stroke-width="2" opacity="0.25"/>

  <!-- Cute highlight reflection on the black hole -->
  <circle cx="230" cy="232" r="12" fill="#fff" opacity="0.04"/>
  <circle cx="226" cy="228" r="5" fill="#fff" opacity="0.08"/>

  <defs>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="30%" stop-color="#6b8afd"/>
      <stop offset="50%" stop-color="#e8b04a"/>
      <stop offset="70%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6b8afd"/>
    </linearGradient>

    <linearGradient id="innerDisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8b04a"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <radialGradient id="holeGrad" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <radialGradient id="outerGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6b8afd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8b04a" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
</svg>
